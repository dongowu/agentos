# AgentOS Agent Config
# A coding assistant agent with file, git, and shell access.

name: coding-agent
description: "An autonomous coding agent that can read, write, and refactor code."

model: gemini-3.5-pro

memory:
  type: redis
  ttl: 86400

tools:
  - file.read
  - file.write
  - git.clone
  - git.status
  - shell
  - http.get

policy:
  allow: ["file.*", "git.*", "http.*", "shell"]
  deny: ["http.post"]

workflow:
  - plan
  - execute
  - reflect
